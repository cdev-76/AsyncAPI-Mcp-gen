version: '3.8'

# OAuth2 stack: OAUTHBEARER + SCRAM-SHA-256 on the same SASL_SSL listener.
# Keycloak is included in the same network so Kafka can reach the JWKS endpoint.
#
# The 'masorange' realm and 'mcp-app' client are imported automatically on startup
# from keycloak-realm.json. No manual Keycloak configuration is needed.
# To modify the realm or client, edit keycloak-realm.json and restart the stack.

services:

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    ports:
      - "9090:8080"   # UI y token endpoint accesibles desde el host
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Controls the 'iss' claim in JWTs. Must match EXPECTED_ISSUER on the Kafka broker.
      KC_HOSTNAME_URL: http://localhost:9090
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/masorange HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r line <&3 && echo \"$$line\" | grep -q 200"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 15

  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka_broker_oauth
    ports:
      - "9092:9092"  # PLAINTEXT — Schema Registry and internal tooling
      - "9095:9095"  # SASL_SSL  — external clients (SCRAM and OAUTHBEARER)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,SASL_SSL://0.0.0.0:9095,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,SASL_SSL://localhost:9095,INTERNAL://kafka:9094
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,SASL_SSL:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Both SASL mechanisms active on the SASL_SSL listener
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256,OAUTHBEARER
      # SCRAM: global JAAS config via KAFKA_OPTS (same as docker-compose.yml)
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf"

      # OAUTHBEARER: inline JAAS per listener (does not interfere with the global SCRAM JAAS)
      KAFKA_LISTENER_NAME_SASL__SSL_OAUTHBEARER_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;

      # JWT validator on the broker: verifies tokens against the Keycloak JWKS endpoint.
      # Uses the internal Docker URL (keycloak:8080), not the host URL (localhost:9090).
      KAFKA_LISTENER_NAME_SASL__SSL_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: >-
        org.apache.kafka.common.security.oauthbearer.secured.OAuthBearerValidatorCallbackHandler
      KAFKA_LISTENER_NAME_SASL__SSL_OAUTHBEARER_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL: >-
        http://keycloak:8080/realms/masorange/protocol/openid-connect/certs
      # Must match exactly the 'iss' claim in tokens issued by Keycloak
      KAFKA_LISTENER_NAME_SASL__SSL_OAUTHBEARER_SASL_OAUTHBEARER_EXPECTED_ISSUER: >-
        http://localhost:9090/realms/masorange
      KAFKA_LISTENER_NAME_SASL__SSL_OAUTHBEARER_SASL_OAUTHBEARER_EXPECTED_AUDIENCE: account

      # SSL
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.keystore.p12
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore.password
      KAFKA_SSL_KEY_CREDENTIALS: keystore.password
      KAFKA_SSL_CLIENT_AUTH: none

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data_oauth:/var/lib/kafka/data
      - ./certs:/etc/kafka/secrets:ro,z
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  kafka-init:
    image: apache/kafka:3.8.1
    container_name: kafka_init_oauth
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    environment:
      KAFKA_USERNAME: ${KAFKA_USERNAME:-testuser}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-testpassword}
    volumes:
      - ./kafka-init.sh:/init.sh:ro,z
    command: bash /init.sh

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: schema-registry-oauth
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9094
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_AUTHENTICATION_METHOD: BASIC
      SCHEMA_REGISTRY_AUTHENTICATION_REALM: SchemaRegistry
      SCHEMA_REGISTRY_AUTHENTICATION_ROLES: admin
      SCHEMA_REGISTRY_OPTS: >-
        -Djava.security.auth.login.config=/etc/schema-registry/schema-registry.jaas
    volumes:
      - ./schema-registry.jaas:/etc/schema-registry/schema-registry.jaas:ro
      - ./schema-registry.passwords:/etc/schema-registry/passwords.properties:ro
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "admin:testpassword", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-oauth
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_SCHEMAREGISTRYAUTH_USERNAME: admin
      KAFKA_CLUSTERS_0_SCHEMAREGISTRYAUTH_PASSWORD: testpassword
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  kafka_data_oauth:
